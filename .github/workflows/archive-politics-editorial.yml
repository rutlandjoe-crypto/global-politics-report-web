name: Preserve Politics editorial URLs

on:
  push:
    branches: [main]
    paths:
      - "public/latest_report.json"

permissions:
  contents: write

concurrency:
  group: preserve-politics-editorial-urls
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Preserve current Politics newsroom stories
        run: node scripts/archive-politics-editorial.mjs

      - name: Commit archive update
        run: |
          if git diff --quiet -- public/politics-editorial-archive.json; then
            echo "Politics editorial archive is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/politics-editorial-archive.json
          git commit -m "Preserve Global Politics Report editorial URLs"
          git pull --rebase origin main
          git push origin HEAD:main
